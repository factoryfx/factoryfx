[versions]
jackson = "2.22.2"
jetty = "12.1.12"
jersey = "4.0.2"
logback = "1.6.3"
slf4j = "2.0.17"
junit = "6.1.3"
javafx = "17.0.17"
nmcp = "1.6.1"
spotbugs-tool = "4.10.3"

[libraries]
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
guava = { module = "com.google.guava:guava", version = "33.6.0-jre" }
mockito-core = { module = "org.mockito:mockito-core", version = "5.23.0" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-datatype-jdk8 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jdk8", version.ref = "jackson" }
jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson" }
jackson-jakarta-rs-json-provider = { module = "com.fasterxml.jackson.jakarta.rs:jackson-jakarta-rs-json-provider", version.ref = "jackson" }
jackson-dataformat-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }

jetty-server = { module = "org.eclipse.jetty:jetty-server", version.ref = "jetty" }
jetty-alpn-java-server = { module = "org.eclipse.jetty:jetty-alpn-java-server", version.ref = "jetty" }
jetty-ee10-servlet = { module = "org.eclipse.jetty.ee10:jetty-ee10-servlet", version.ref = "jetty" }
jetty-ee10-webapp = { module = "org.eclipse.jetty.ee10:jetty-ee10-webapp", version.ref = "jetty" }
jetty-http2-server = { module = "org.eclipse.jetty.http2:jetty-http2-server", version.ref = "jetty" }
jetty-compression-server = { module = "org.eclipse.jetty.compression:jetty-compression-server", version.ref = "jetty" }
jetty-compression-gzip = { module = "org.eclipse.jetty.compression:jetty-compression-gzip", version.ref = "jetty" }

jersey-proxy-client = { module = "org.glassfish.jersey.ext:jersey-proxy-client", version.ref = "jersey" }
jersey-client = { module = "org.glassfish.jersey.core:jersey-client", version.ref = "jersey" }
jersey-common = { module = "org.glassfish.jersey.core:jersey-common", version.ref = "jersey" }
jersey-server = { module = "org.glassfish.jersey.core:jersey-server", version.ref = "jersey" }
jersey-container-servlet = { module = "org.glassfish.jersey.containers:jersey-container-servlet", version.ref = "jersey" }
jersey-media-json-jackson = { module = "org.glassfish.jersey.media:jersey-media-json-jackson", version.ref = "jersey" }
jersey-hk2 = { module = "org.glassfish.jersey.inject:jersey-hk2", version.ref = "jersey" }

jakarta-ws-rs-api = { module = "jakarta.ws.rs:jakarta.ws.rs-api", version = "4.0.0" }
jakarta-activation-api = { module = "jakarta.activation:jakarta.activation-api", version = "2.1.4" }
jakarta-xml-bind-api = { module = "jakarta.xml.bind:jakarta.xml.bind-api", version = "4.0.4" }
jakarta-annotation-api = { module = "jakarta.annotation:jakarta.annotation-api", version = "3.0.0" }
jakarta-servlet-api = { module = "jakarta.servlet:jakarta.servlet-api", version = "6.1.0" }
jakarta-xml-ws-api = { module = "jakarta.xml.ws:jakarta.xml.ws-api", version = "4.0.3" }
jakarta-xml-soap-api = { module = "jakarta.xml.soap:jakarta.xml.soap-api", version = "3.0.2" }

postgresql = { module = "org.postgresql:postgresql", version = "42.7.13" }
embedded-postgres = { module = "io.zonky.test:embedded-postgres", version = "2.2.2" }
ojdbc8 = { module = "com.oracle.database.jdbc:ojdbc8", version = "23.26.3.0.0" }
h2 = { module = "com.h2database:h2", version = "2.4.240" }

controlsfx = { module = "org.controlsfx:controlsfx", version = "11.2.4" }
richtextfx = { module = "org.fxmisc.richtext:richtextfx", version = "0.11.7" }

metrics-jetty12 = { module = "io.dropwizard.metrics:metrics-jetty12", version = "4.2.39" }
istack-commons-runtime = { module = "com.sun.istack:istack-commons-runtime", version = "4.2.0" }
jaxb-runtime = { module = "org.glassfish.jaxb:jaxb-runtime", version = "4.0.9" }
saaj-impl = { module = "com.sun.xml.messaging.saaj:saaj-impl", version = "3.0.6" }
ini4j = { module = "org.ini4j:ini4j", version = "0.5.4" }
javapoet = { module = "com.squareup:javapoet", version = "1.13.0" }
jmh-core = { module = "org.openjdk.jmh:jmh-core", version = "1.37" }
jmh-generator-annprocess = { module = "org.openjdk.jmh:jmh-generator-annprocess", version = "1.37" }

[plugins]
spotbugs = { id = "com.github.spotbugs", version = "6.5.10" }
versions = { id = "io.github.ben-manes.versions", version = "0.61.0" }
nmcp = { id = "com.gradleup.nmcp", version.ref = "nmcp" }
nmcp-aggregation = { id = "com.gradleup.nmcp.aggregation", version.ref = "nmcp" }
javafxplugin = { id = "org.openjfx.javafxplugin", version = "0.1.0" }
